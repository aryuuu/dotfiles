# Setup monitors
# See https://wiki.hyprland.org/Configuring/Monitors/
# monitor=,preferred,auto,auto

# monitor=name,resolution,position,scale
monitor=eDP-1,1920x1080@144,0x1080,1
monitor=DP-1,1920x1080@144,0x0,1
# monitor=DP-1,2560x1440@165,1920x0,1
# monitor=DP-1,3840×2160@165,1920x0,1

# See https://wiki.hyprland.org/Configuring/Keywords/ for more

# Execute your favorite apps at launch
exec-once = ~/.config/hypr/xdg-portal-hyprland
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/lib/polkit-kde-authentication-agent-1

exec-once = killall mako; killall dunst; dunst
# exec-once = killall mako; killall dunst; mako
exec-once = killall udiskie; udiskie -t
exec-once = wl-paste --watch cliphist store
exec-once = ~/.scripts/handle_monitor_connect.sh

# locking and powersaving
# exec-once = swayidle -w timeout 10 'if pgrep -x swaylock; then hyprctl dispatch dpms off; fi' resume 'hyprctl dispatch dpms on'
# exec-once = swayidle -w timeout 600 '~/.scripts/lockscreen.sh' timeout 630 'hyprctl dispatch dpms off' resume 'hyprctl dispatch dpms on' before-sleep '~/.scripts/lockscreen.sh'
# after-resume 'sleep .2; systemctl --user restart waybar'

exec-once = waybar
exec = swaybg -m fill -i ~/pictures/wallpaper/bender.png

# Source a file (multi-file configs)
source = ~/.config/hypr/moccha.conf
source = ~/.config/hypr/keybindings.conf
source = ~/.config/hypr/windowrules.conf

env = bitdepth,10
# env = ELECTRON_OZONE_PLATFORM_HINT,wayland
# env = XCURSOR_SIZE,24
# env = XDG_SESSION_TYPE,wayland
# env = QT_QPA_PLATFORM,wayland;xcb
# env = GDK_BACKEND,wayland,x11
# env = CLUTTER_BACKEND,wayland
# env = SDL_VIDEODRIVER,wayland

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    touchpad {
        natural_scroll = true
    }

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    gaps_in = 2
    gaps_out = 1
    border_size = 2
    #col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.active_border=rgb(cdd6f4)
    col.inactive_border = rgba(595959aa)

    layout = dwindle
}

misc {
    disable_hyprland_logo = yes
    focus_on_activate = 0
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    rounding = 5
    # blur = yes
    # blur_size = 7
    # blur_passes = 3
    # blur_new_optimizations = on
    blurls = lockscreen

    blur {
        enabled = yes
        size = 5
        passes = 2
    }

    drop_shadow = yes
    shadow_range = 4
    shadow_render_power = 3
    col.shadow = rgba(1a1a1aee)
}

animations {
    enabled = no

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 1, myBezier
    animation = windowsOut, 1, 1, default, popin 80%
    animation = border, 1, 3, default
    animation = fade, 1, 1, default
    animation = workspaces, 1, 1, default
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    pseudotile = no # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    force_split = 2
    preserve_split = yes # you probably want this
    # like smart gaps in i3
    no_gaps_when_only = no
}

master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
    # new_is_master = false
}

gestures {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    workspace_swipe = on
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs

device {
    name = josefadamcik-sofle
    repeat_rate = 40
    repeat_delay = 200
}

device {
    name = at-translated-set-2-keyboard 
    repeat_rate = 40
    repeat_delay = 200
}


