# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER

bind = $mainMod, Q, exec, ~/.scripts/lockscreen.sh

bind = $mainMod, PRINT, exec, grim -g "$(slurp)" - | swappy -f - # take a screenshot
bind = $mainMod, mouse:273, exec, grim -g "$(slurp)" - | swappy -f - # take a screenshot
# bind = $mainMod, mouse:273, exec, grim -g "$(slurp)" - | satty -f - # take a screenshot

bind = $mainMod, O, exec, ~/.scripts/wl-ocr.sh

bind = $mainMod, V, exec, pgrep wf-recorder && pkill wf-recorder || wf-recorder -g "$(slurp -o)" -f /home/fatt/Videos/recording-$(date +%F-%H-%M-%S).mp4
# bind = $mainMod, V, exec, pgrep wf-recorder && pkill wf-recorder || wf-recorder -g "$(slurp -o)" -F format=rgb24 -x rgb24 -p qp=0 -p crf=0 -p preset=veryslow -p tune=animation -c libx264rgb -f /home/fatt/Videos/recording-$(date +%F-%H-%M-%S).mp4

bind = $mainMod SHIFT, V, exec, pgrep wf-recorder && pkill wf-recorder || wf-recorder -f /home/fatt/Videos/recording-$(date +%F-%H-%M-%S).mp4

bind = $mainMod, RETURN, exec, alacritty # open terminal
bind = $mainMod SHIFT, SPACE, togglefloating, # Allow a window to float
bind = $mainMod, E, togglesplit, # dwindle

# menus
bind = $mainMod, D, exec, rofi -show run
bind = $mainMod, SPACE, exec, rofi -show run
bind = $mainMod, M, exec, rofi -show ssh
bind = $mainMod, N, exec, /usr/bin/networkmanager_dmenu -c -i -fn "FontAwesome" -p  -l 5 -sb $DMENU_SB -sf $DMENU_SF -nb $DMENU_NB -nf $DMENU_NF -shb $DMENU_SHB -shf $DMENU_SHF -nhb $DMENU_NHB -nhf $DMENU_NHF
bind = $mainMod SHIFT, N, exec, ~/.scripts/rofi-bluetooth.sh
bind = $mainMod, P, exec, ~/.scripts/rofi-passmenu.sh -i -fn "FontAwesome" -p ' '
# bind = $mainMod, C, exec, CM_LAUNCHER=rofi clipmenu -c -i -f -fn "FontAwesome" -p ' ' -l 10 -sb $DMENU_SB -sf $DMENU_SF -nb $DMENU_NB -nf $DMENU_NF -shb $DMENU_SHB -shf $DMENU_SHF -nhb $DMENU_NHB -nhf $DMENU_NHF & sleep 0.1; hyprctl dispatch focuswindow "^(Rofi)"
# bind = $mainMod, C, exec, rofi -modi clipboard:~/.scripts/cliphist-rofi-img -show clipboard -show-icons -c -i -f -fn "FontAwesome" -p ' ' -l 10 -sb $DMENU_SB -sf $DMENU_SF -nb $DMENU_NB -nf $DMENU_NF -shb $DMENU_SHB -shf $DMENU_SHF -nhb $DMENU_NHB -nhf $DMENU_NHF
bind = $mainMod, C, exec, rofi -modi clipboard:~/.scripts/cliphist-rofi -show clipboard -show-icons -c -i -f -fn "FontAwesome" -p ' ' -l 10 -sb $DMENU_SB -sf $DMENU_SF -nb $DMENU_NB -nf $DMENU_NF -shb $DMENU_SHB -shf $DMENU_SHF -nhb $DMENU_NHB -nhf $DMENU_NHF
bind = $mainMod, I, exec, ~/.scripts/sink.sh
bind = $mainMod, B, exec, ~/.scripts/books.sh
bind = $mainMod, U, exec, ~/project/dmenu-emoji/dmenu-emoji.sh
bind = $mainMod SHIFT, U, exec, ~/.scripts/dmemes.sh
bind = $mainMod, S, exec, ~/.scripts/dsnippet.sh 1
bind = $mainMod, G, exec, ~/.scripts/dmenu-github.sh
bind = $mainMod SHIFT, T, exec, ~/.scripts/rofi-checklist.sh

bind = , XF86AudioRaiseVolume, exec,  pactl set-sink-volume @DEFAULT_SINK@ +5%
bind = , XF86AudioLowerVolume, exec,  pactl set-sink-volume @DEFAULT_SINK@ -5%
bind = $mainMod, XF86AudioRaiseVolume, exec,  pactl set-source-volume @DEFAULT_SOURCE@ +5%
bind = $mainMod, XF86AudioLowerVolume, exec,  pactl set-source-volume @DEFAULT_SOURCE@ -5%
bind = , XF86AudioMute, exec,  pactl set-sink-mute @DEFAULT_SINK@ toggle
bind = , XF86AudioMicMute, exec,  pactl set-source-mute @DEFAULT_SOURCE@ toggle

bind = , XF86MonBrightnessDown, exec, ~/.scripts/backlight/dec
bind = , XF86MonBrightnessUp, exec, ~/.scripts/backlight/inc

bind = $mainMod, Prior, exec, ~/.scripts/hypr_brightness.sh -
bind = $mainMod, Next, exec, ~/.scripts/hypr_brightness.sh +

bind = $mainMod, grave, exec, dunstctl history-pop
bind = $mainMod SHIFT, grave, exec, dunstctl close-all

### Gromit related bindings
bind = $mainMod SHIFT, D, togglespecialworkspace, gromit
bind = , F8, exec, gromit-mpx --undo
bind = SHIFT , F8, exec, gromit-mpx --redo
bind = $mainMod, mouse:274, togglespecialworkspace, gromit
bind = $mainMod, mouse:275, exec, gromit-mpx --undo
bind = $mainMod, mouse:276, exec, gromit-mpx --redo

### terminal scratchpad bindings
bind = $mainMod, T, togglespecialworkspace, term

### widgets 
# bind = $mainMod, W, exec, eww list-windows | grep "calendar" && eww close calendar || eww open calendar
bind = $mainMod, W, exec, ~/.scripts/work-logger.sh

# bind = $mainMod, grave, exec, makoctl restore
# bind = $mainMod SHIFT, grave, exec, makoctl dismiss 
# bind = $mainMod, X, exec, makoctl dismiss -a
# bind = $mainMod SHIFT, O, exec, makoctl invoke

# Kill window
bind = $mainMod SHIFT, Q, killactive, # close the active window

#  misc control
bind = $mainMod, F, fullscreen

# Move focus with mainMod + arrow keys
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Move window
bind = $mainMod SHIFT, h, movewindow, l
bind = $mainMod SHIFT, l, movewindow, r
bind = $mainMod SHIFT, k, movewindow, u
bind = $mainMod SHIFT, j, movewindow, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod, comma, workspace, 11
bind = $mainMod, period, workspace, 12
bind = $mainMod, slash, workspace, 13
bind = $mainMod, semicolon, workspace, 14
bind = $mainMod, bracketleft, workspace, 15
bind = $mainMod, bracketright, workspace, 16

bind = $mainMod, Tab, focuscurrentorlast
# bind = $mainMod, Tab, focusurgentorlast 


# Move active window to a workspace with mainMod + SHIFT + [0-9]
# can use movetoworkspacesilent instead: https://www.reddit.com/r/hyprland/comments/11wjpa7/how_to_move_a_window_to_another_workspace_with/
bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9
bind = $mainMod SHIFT, 0, movetoworkspacesilent, 10
bind = $mainMod SHIFT, comma, movetoworkspacesilent, 11
bind = $mainMod SHIFT, period, movetoworkspacesilent, 12
bind = $mainMod SHIFT, slash, movetoworkspacesilent, 13
bind = $mainMod SHIFT, semicolon, movetoworkspacesilent, 14
bind = $mainMod SHIFT, bracketleft, movetoworkspacesilent, 15
bind = $mainMod SHIFT, bracketright, movetoworkspacesilent, 16


# Scroll through existing workspaces with mainMod + scroll
# bind = $mainMod, mouse_down, workspace, e+1
# bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
# bindm = $mainMod, mouse:273, resizewindow

# resize mode
# will switch to a submap called resize
bind=$mainMod,R,submap,resize

# will start a submap called "resize"
submap=resize

# sets repeatable binds for resizing the active window
binde=,l,resizeactive,30 0
binde=,h,resizeactive,-30 0
binde=,k,resizeactive,0 -30
binde=,j,resizeactive,0 30

# use reset to go back to the global submap
bind=,escape,submap,reset 
bind=,return,submap,reset 
bind=$mainMod,R,submap,reset 

# will reset the submap, meaning end the current one and return to the global one
submap=reset

# keybinds further down will be global again...
