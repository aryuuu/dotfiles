# Example windowrule v1
# windowrule = float, ^(kitty)$
# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# rules below would make the specific app transparent
#
windowrule {
  name = windowrule-1
  workspace = 3
  opacity = 0.8 0.8
  match:class = ^(org.telegram.desktop)$
}

windowrule {
  name = windowrule-2
  workspace = 9
  match:class = (?i)^(slack)$
  # immediate = true
}

windowrule {
  name = windowrule-3
  workspace = 7
  match:class = ^(Postman)$
}

windowrule {
  name = windowrule-4
  workspace = 11
  match:class = ^(DBeaver)$
}

windowrule {
  name = windowrule-5
  workspace = 11
  match:class = ^(robo3t)$
}

windowrule {
  name = windowrule-6
  workspace = 11
  match:class = ^(mongodb-compass)$
}

windowrule {
  name = windowrule-7
  workspace = 14
  match:class = ^(code-oss)$
}

windowrule {
  name = windowrule-8
  workspace = 8
  match:class = ^(Authy Desktop)$
}


windowrule {
  name = windowrule-9
  opacity = 0.8 0.8
  match:class = ^(kitty)$
}

windowrule {
  name = windowrule-10
  opacity = 0.8 0.8
  match:class = ^(thunar)$
}

# windowrulev2 = opacity 0.9 0.9, class:^(com.mitchellh.ghostty)$
# windowrulev2 = opacity 0.85 0.85, class:^(Slack)$
windowrule {
  name = windowrule-11
  stay_focused = on
  match:class = (Rofi)
}

# windowrulev2 = forceinput, class:(Rofi)

windowrule {
  name = windowrule-12
  opacity = 0.0 override 0.0 override
  no_anim = on
  no_initial_focus = on
  max_size = 1 1
  no_blur = on
  match:class = ^(xwaylandvideobridge)$
}



### Gromit related rules
workspace = special:gromit, gapsin:0, gapsout:0, on-created-empty: gromit-mpx -a
windowrule {
  name = windowrule-13
  no_blur = on
  opacity = 1 override
  # 1 = override
  no_shadow = on
  size = (monitor_w*1) (monitor_h*1)
  match:class = ^(Gromit-mpx)$
}

# windowrulev2 = fakefullscreen, class:^(Gromit-mpx)$

### terminal related rules
# workspace = special:term, on-created-empty:[float] alacritty

### satty related rules
windowrule {
  name = windowrule-14
  float = on
  match:class = ^(satty)$
}

