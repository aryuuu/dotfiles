[custom_commands.stacked_pr]
name = "Stacked PR"
description = "Create stacked PR from all the pushed bookmarks from the current changeset and its descendants"
lua = """
local f = loadfile(os.getenv("HOME") .. "/.config/jjui/scripts/stacked_pr.lua")
if f then f() else flash("Failed to load script") end
"""

[custom_commands.push_with_descendants]
name = "Push with Descendants"
description = "Push current changeset and all descendants with bookmarks"
lua = """
-- Push current changeset and all descendants with bookmarks
local change_id = revisions.current()
if not change_id then
  flash("No revision selected")
  return
end

-- Get all descendants including current
local revset = change_id .. "::"
local output, err = jj("log", "-r", revset, "--no-graph", "--template", [[change_id.shortest() ++ '\n']])
if err then
  flash("Error getting descendants: " .. err)
  return
end

local change_ids = split_lines(output, false)
if #change_ids == 0 then
  flash("No revisions found")
  return
end

-- Get bookmarks for all these revisions
local bookmarks = {}
local bookmark_set = {}
for _, cid in ipairs(change_ids) do
  local bookmark_output, bookmark_err = jj("bookmark", "list", "-r", cid, "--template", [[name ++ '\n']])
  if not bookmark_err and bookmark_output ~= "" then
    local names = split_lines(bookmark_output, false)
    for _, name in ipairs(names) do
      if name ~= "" and not bookmark_set[name] then
		bookmark_set[name] = true
        table.insert(bookmarks, name)
      end
    end
  end
end

if #bookmarks == 0 then
  flash("No bookmarks found on current revision or descendants")
  return
end

-- Build git push command with all bookmarks
local args = {"git", "push", "--allow-new"}
for _, bookmark in ipairs(bookmarks) do
  table.insert(args, "--bookmark")
  table.insert(args, bookmark)
end

-- Show what we're about to push
local bookmark_list = table.concat(bookmarks, ", ")
flash("Pushing bookmarks: " .. bookmark_list)

-- Execute the push
jj_async(args)
"""

[custom_commands.push_with_descendants_bare]
name = "Push Descendants bare"
description = "Push current changeset and all descendants"
lua = """
local change_id = revisions.current()
if not change_id then
  flash("No revision selected")
  return
end

-- Get all descendants including current
local revset = change_id .. "::"
local output, err = jj("log", "-r", revset, "--no-graph", "--template", [[change_id.shortest() ++ '\n']])
if err then
  flash("Error getting descendants: " .. err)
  return
end

local change_ids = split_lines(output, false)
if #change_ids == 0 then
  flash("No revisions found")
  return
end

-- Build git push command with all change ids
local args = {"git", "push"}
for _, cid in ipairs(change_ids) do
  table.insert(args, "--change")
  table.insert(args, cid)
end

-- Show what we're about to push
local cid_list = table.concat(change_ids, ", ")
flash("Pushing changes: " .. cid_list)

-- Execute the push
jj_async(args)
"""
