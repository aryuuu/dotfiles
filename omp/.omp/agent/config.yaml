defaultProvider: kiro
defaultModel: kiro/claude-opus-4.6
defaultThinkingLevel: "on"
theme: 
  dark: titanium
  light: light
modelRoles: 
  default: kiro/claude-opus-4.6
  smol: kiro/claude-sonnet-4.6
  vision: kiro/claude-opus-4.6
  advisor: kiro/claude-opus-4.6
